<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>好物雷達 GoodRadar｜所有連結</title>
<meta name="description" content="好物雷達的入口：酷澎・蝦皮的優惠，還有我們自己做的線上下載工具與免費小遊戲。">
<meta property="og:title" content="好物雷達 GoodRadar｜所有連結">
<meta property="og:description" content="酷澎・蝦皮優惠、線上下載工具、免費小遊戲。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0a1512">
<link rel="icon" href="img/threads_128.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#08120f;--card:#0f211b;--line:rgba(255,255,255,.10);--gold:#ffd479;--txt:#e9f1f5;--dim:#9db0bd}
html,body{margin:0;padding:0;background:radial-gradient(1200px 600px at 50% -10%,#12362b 0%,#08120f 60%) no-repeat,var(--bg);color:var(--txt);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:26px 16px 40px}
.brand{text-align:center;margin-bottom:22px}
.brand img{width:78px;height:78px;border-radius:50%;border:2px solid var(--gold);background:#0b1a16;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
h1{font-size:20px;margin:12px 0 6px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:13px;margin:0;line-height:1.7}
h2{font-size:13px;color:var(--gold);letter-spacing:.08em;margin:24px 4px 10px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;position:relative;overflow:hidden;transition:transform .12s ease,border-color .12s}
a.card img.shot{width:100%;height:auto;display:block}
a.card:active{transform:scale(.98)}
a.card:hover{border-color:rgba(255,212,121,.55)}
.share{margin-top:26px;text-align:center}
.share button{appearance:none;border:1px solid rgba(255,212,121,.5);background:rgba(255,212,121,.12);color:var(--gold);padding:12px 22px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
.share button:active{transform:scale(.98)}
.foot{margin-top:22px;color:#6f8592;font-size:11.5px;text-align:center;line-height:1.9}
.foot a{color:#8fa6b4;text-decoration:none;border-bottom:1px solid rgba(143,166,180,.35)}
@media(max-width:360px){.grid{gap:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="img/threads_128.png" alt="好物雷達">
    <h1>好物雷達 GoodRadar</h1>
    <p class="sub">看到覺得不錯的東西就放上來<br>你可以先看看，喜歡再自己決定</p>
  </div>

  <h2>🛍 先逛這裡</h2>
  <div class="grid">
    <a class="card" href="https://coupa.ng/cqmRjw" target="_blank" rel="noopener">
      <img class="shot" src="cards/coupang.png" alt="酷澎 Coupang">
    </a>
    <a class="card" href="https://s.shopee.tw/4B0wM63aE9" target="_blank" rel="noopener">
      <img class="shot" src="cards/shopee.png" alt="蝦皮 Shopee">
    </a>
  </div>

  <h2>🧰 我們自己做的</h2>
  <div class="grid">
    <a class="card" href="https://scefo.com/" target="_blank" rel="noopener">
      <img class="shot" src="cards/scefo.png" alt="轉運站">
    </a>
    <a class="card" href="https://v8i8.com/" target="_blank" rel="noopener">
      <img class="shot" src="cards/v8i8.png" alt="v8i8 去水印">
    </a>
    <a class="card" href="https://kenqplay.com/zh-tw/" target="_blank" rel="noopener">
      <img class="shot" src="cards/kenq.png" alt="啃Q 小遊戲">
    </a>
    <a class="card" href="https://www.threads.com/@scefo0971" target="_blank" rel="noopener">
      <img class="shot" src="cards/threads.png" alt="脆 Threads">
    </a>
  </div>

  <div class="share">
    <button id="shareBtn" type="button">📤 分享給朋友</button>
  </div>

  <p class="foot">
    我可能會從合作夥伴的活動中收取佣金，不影響你購買的價格。<br>
    <a href="https://www.facebook.com/profile.php?id=61595128207211" target="_blank" rel="noopener">Facebook 粉專</a>　·　
    <a href="https://www.threads.com/@scefo0971" target="_blank" rel="noopener">脆 Threads</a><br>
    © 好物雷達 GoodRadar
  </p>
</div>
<script>
(function () {
  var btn = document.getElementById('shareBtn');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var data = { title: '好物雷達 GoodRadar', text: '酷澎・蝦皮的優惠，還有線上下載工具與免費小遊戲', url: location.href };
    if (navigator.share) { navigator.share(data).catch(function () {}); return; }
    var done = function () { btn.textContent = '✅ 已複製連結'; setTimeout(function () { btn.textContent = '📤 分享給朋友'; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).then(done, function () { prompt('複製這個連結分享：', location.href); });
    } else { prompt('複製這個連結分享：', location.href); }
  });
})();
</script>
</body>
</html>
